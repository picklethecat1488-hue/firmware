[[controllers]]
name = "Led"
msg_type = "model::types::SystemLedState"
macro_params = ["$rx:expr", "$telemetry_tx:expr", "$driver_type:ty"]
task_call_args = ["$rx", "$telemetry_tx"]
controller_type = "$crate::led_controller::LedController<$driver_type>"
spawn_call_args = ["$rx.receiver()", "$telemetry.sender()"]
macro_generics = ["$driver_type:ty"]
spawn_generics = ["$driver_type"]
impl_generics = "<D>"
impl_type = "LedController<D>"
impl_phantom = "D"
run_params = [
    { param = "r", type = "$crate::LedReceiver<$crate::CriticalSectionRawMutex>" },
    { param = "t", type = "$crate::TelemetrySender<$crate::CriticalSectionRawMutex>" }
]

