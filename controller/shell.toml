[[cli_commands]]
group = "Battery"
cmd_name = "battery"
variant = "Battery"
subcommand_type = "battery_controller::BatterySubcommand"
handler = "battery_controller::handle_battery_cli"
help = "Battery commands (battery status, battery test-alert)"

[[cli_commands]]
group = "Thermal"
cmd_name = "thermal"
variant = "Thermal"
subcommand_type = "thermal_controller::ThermalSubcommand"
handler = "thermal_controller::handle_thermal_cli"
help = "Thermal commands (thermal status, thermal mcu)"

[[cli_commands]]
group = "Motor"
cmd_name = "motor"
variant = "Motor"
subcommand_type = "motor_controller::MotorSubcommand"
handler = "motor_controller::handle_motor_cli"
help = "Motor commands (motor speed <speed>, motor stop, motor current, motor calibrate <state> [max_rpm] [rpm_limit] [--partition <partition>])"
args = [
    { name = "arg1", type = "string", help = "First argument (speed or calibration state)" },
    { name = "arg2", type = "string", help = "Second argument (max_rpm)" },
    { name = "arg3", type = "string", help = "Third argument (rpm_limit)" },
    { name = "partition", type = "string", help = "Optional partition name" }
]

[[cli_commands]]
group = "Sensor"
cmd_name = "sensor"
variant = "Sensor"
subcommand_type = "sensor_controller::SensorSubcommand"
handler = "sensor_controller::handle_sensor_cli"
help = "Sensor commands (sensor status, sensor cal_near <dir>, sensor cal_far <dir> [--partition <partition>])"
args = [
    { name = "arg1", type = "string", help = "First argument (direction: north, east, west)" },
    { name = "partition", type = "string", help = "Optional partition name" }
]

[[cli_commands]]
group = "Fs"
cmd_name = "fs"
variant = "Fs"
subcommand_type = "filesystem_controller::FilesystemSubcommand"
handler = "filesystem_controller::handle_fs_cli"
help = "Filesystem commands (fs format, fs ls [--partition <partition>])"
args = [
    { name = "target", type = "Option<filesystem_controller::FormatTarget>", help = "Optional target to format (fs, telemetry, all)" },
    { name = "partition", type = "string", help = "Optional partition name" }
]

[[cli_commands]]
group = "System"
cmd_name = "system"
variant = "System"
subcommand_type = "system_controller::SystemSubcommand"
handler = "system_controller::handle_system_cli"
help = "System commands (system activity, system crash [core])"
args = [
    { name = "arg1", type = "Option<system_controller::CpuTarget>", help = "Optional target core (core0, core1)" }
]

[[cli_commands]]
group = "I2c"
cmd_name = "i2c"
variant = "I2c"
subcommand_type = "platform::i2c::I2cSubcommand"
handler = "platform::i2c::handle_i2c_cli"
help = "I2C commands (i2c scan)"
args = [
    { name = "bus", type = "string", help = "Target bus name" }
]

[[cli_commands]]
group = "Gpio"
cmd_name = "gpio"
variant = "Gpio"
subcommand_type = "platform::gpio::GpioSubcommand"
handler = "platform::gpio::handle_gpio_cli"
help = "GPIO commands (gpio status, gpio read <pin>)"
args = [
    { name = "pin", type = "Option<u32>", help = "Pin number to read" }
]

[[cli_commands]]
group = "Led"
cmd_name = "led"
variant = "Led"
subcommand_type = "led_controller::LedSubcommand"
handler = "led_controller::handle_led_cli"
help = "LED commands (led off, led green, led blue, led yellow, led orange, led blink-four, led blink-slow)"


