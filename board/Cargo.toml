[package]
name = "board"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[lib]
name = "board"
path = "src/lib.rs"

[dependencies]
model = { path = "../model" }
platform = { path = "../platform", features = ["dual-core"] }
rp2040 = { path = "../platform/src/rp2040" }
peripherals = { path = "../peripherals", features = ["mock"] }
controller = { path = "../controller" }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embassy-sync = "0.6.2"
embassy-futures = "0.1.0"
embedded-io = "0.6.0"
heapless = "0.8.0"

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
embassy-executor = { version = "0.7.0", features = ["task-arena-size-32768", "arch-cortex-m", "executor-thread"] }
embassy-time = { version = "0.4.0", features = ["defmt"] }
embassy-rp = { version = "0.3.0", features = ["defmt", "rp2040", "time-driver", "critical-section-impl", "rt"] }
defmt = "0.3"
panic-probe = { version = "0.3", features = ["print-defmt"] }
cortex-m = { version = "0.7" }
cortex-m-rt = "0.7"
fixed = "1.31.0"

[target.'cfg(not(all(target_arch = "arm", target_os = "none")))'.dependencies]
embassy-executor = { version = "0.7.0", features = ["arch-std", "executor-thread", "task-arena-size-1048576"] }
embassy-time = "0.4.0"
defmt = "0.3"

[features]
default = []
tracing = []
