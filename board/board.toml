[boards.cat_detector]
chip = "rp2040"
flash_base = 0x10000000
flash_size = 0x00200000         # 2 MB
sram_size = 0x00042000          # 264 KB
core0_stack_size = 24576        # 24 KB
core1_stack_size = 16384        # 16 KB
stack_top = 0x20042000
core0_stack_bottom = 0x2003C000
core_monitor_timeout_ms = 10000
core_monitor_warn_pct = 80

[boards.cat_detector.pins]
PUMP_PIN_IA = 19
PUMP_PIN_IB = 20
I2C_SDA_PIN = 12
I2C_SCL_PIN = 13
UART_TX_PIN = 0
UART_RX_PIN = 1
TOF_NORTH_XSHUT_PIN = 4
TOF_EAST_XSHUT_PIN = 5
TOF_WEST_XSHUT_PIN = 6
TOF_NORTH_INT_PIN = 7
TOF_EAST_INT_PIN = 9
TOF_WEST_INT_PIN = 10
FUEL_GAUGE_INT_PIN = 14

[boards.cat_detector.buses.i2c]
sda = "I2C_SDA_PIN"
scl = "I2C_SCL_PIN"
frequency = 400000

[boards.cat_detector.hardware_resources]
TOF_NORTH_I2C_ADDR = { value = 0x30, type = "u8" }
TOF_EAST_I2C_ADDR = { value = 0x31, type = "u8" }
TOF_WEST_I2C_ADDR = { value = 0x32, type = "u8" }
DEFAULT_WAKE_THRESHOLD_MM = { value = 300, type = "u16" }
DEFAULT_PRESS_THRESHOLD_MM = { value = 20, type = "u16" }
DEFAULT_NEAR_THRESHOLD_MM = { value = 100, type = "u16" }
MAX_CRASH_LOGS = { value = 10, type = "u32" }

[boards.cat_detector.partitions.storage]
start = 0x001C0000
end = 0x00200000

[boards.cat_detector.partitions.fs]
start = 0x001C0000
end = 0x001D0000

[boards.cat_detector.partitions.telemetry]
start = 0x001D0000
end = 0x00200000
