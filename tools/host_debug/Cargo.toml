[package]
name = "host_debug"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
tool_common = { path = "../../platform/host" }
serde_json = "1.0"

[target.'cfg(not(all(target_arch = "arm", target_os = "none")))'.dependencies]
clap = { version = "4.4", features = ["derive"] }
probe-rs = { version = "0.31.0", features = [] }
ctrlc = "3.4"
