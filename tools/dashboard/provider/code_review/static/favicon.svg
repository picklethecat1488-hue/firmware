<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a222c"/>
      <stop offset="100%" stop-color="#04090c"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#14d9c4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#c87a32"/>
    </linearGradient>
  </defs>
  <!-- Background plaque -->
  <rect x="1" y="1" width="30" height="30" rx="4" fill="url(#bg)" stroke="#00f0ff" stroke-width="1.5"/>
  <!-- Inner bevel border -->
  <rect x="3" y="3" width="26" height="26" rx="2" fill="none" stroke="#0b5966" stroke-width="1"/>
  <!-- Xerxes Neural Node Icon -->
  <polygon points="16,6 25,16 16,26 7,16" fill="none" stroke="url(#cyan-glow)" stroke-width="2.2"/>
  <circle cx="16" cy="16" r="3.5" fill="#00f0ff"/>
  <circle cx="16" cy="16" r="1.5" fill="#ffffff"/>
  <!-- Accent terminal nodes -->
  <circle cx="16" cy="6" r="1.2" fill="#ffd700"/>
  <circle cx="25" cy="16" r="1.2" fill="#c87a32"/>
</svg>
