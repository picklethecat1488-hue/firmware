# app/app.toml
# Application device and controller topology configuration for Cat Detector
# Documented in CONTRIBUTING.md

[apps.cat_detector]
shell_config = "CatDetectorShellConfig"
cli_handlers = ["Battery", "Thermal", "Motor", "Sensor", "Fs", "System", "I2c", "Gpio", "Led", "Core"]

# Define static channels
[apps.cat_detector.channels]
motor = { type = "controller::MotorChannel", capacity = 4 }
system = { type = "controller::SystemChannel", capacity = 16 }
sensor_north = { type = "controller::SensorChannel", capacity = 4 }
sensor_east = { type = "controller::SensorChannel", capacity = 4 }
sensor_west = { type = "controller::SensorChannel", capacity = 4 }
thermal = { type = "controller::ThermalChannel", capacity = 4 }
thermal_action = { type = "embassy_sync::channel::Channel<MutexRaw, controller::types::ThermalUpdateAction, 4>", val = "embassy_sync::channel::Channel::new()" }
battery = { type = "controller::BatteryChannel", capacity = 4 }
led = { type = "controller::LedChannel", capacity = 4 }
telemetry = { type = "controller::TelemetryChannel", capacity = "{ controller::telemetry_controller::CHANNEL_CAPACITY }" }
filesystem = { type = "controller::FilesystemChannel", capacity = 16 }

# Define the controller topology
[[apps.cat_detector.controllers]]
name = "Thermal"
instance = "controllers.core0.thermal"
generics = "app::TempSensorDevice"

[[apps.cat_detector.controllers]]
name = "Battery"
instance = "controllers.core0.battery"
generics = "app::BatteryDevice, app::ChargerDevice, app::AlertPinType"

[[apps.cat_detector.controllers]]
name = "Led"
instance = "controllers.core0.led"
generics = "app::LedDevice"

[[apps.cat_detector.controllers]]
name = "System"
instance = "controllers.core0.system"
channel = "SYSTEM_CHANNEL, THERMAL_ACTION_CHANNEL"
generics = "app::SystemControllerType"

[[apps.cat_detector.controllers]]
name = "Filesystem"
instance = "fs_controller"
generics = "app::FlashDeviceType"

[[apps.cat_detector.controllers]]
name = "Telemetry"
instance = "telemetry_ctrl"
generics = "{ controller::telemetry_controller::CHANNEL_CAPACITY }, platform::flash::SharedFlashMutex<platform::BlockingAsyncFlash<app::FlashDevice>>"

[[apps.cat_detector.controllers]]
name = "Motor"
core = 1
instance = "controllers.core1.motor"
generics = "crate::MotorDevice, crate::CurrentSensorDevice"
# Motor also registers the raw motor device into motors shell field
device_shell_type = "MotorDevice"

[[apps.cat_detector.controllers]]
name = "Sensor"
core = 1
instance = "controllers.core1.sensor_north"
generics = "crate::ProximitySensorDevice, crate::DataReadyPinType, crate::SystemCommand"
shell_name = "north"

[[apps.cat_detector.controllers]]
name = "Sensor"
core = 1
instance = "controllers.core1.sensor_east"
generics = "crate::ProximitySensorDevice, crate::DataReadyPinType, crate::SystemCommand"
shell_name = "east"

[[apps.cat_detector.controllers]]
name = "Sensor"
core = 1
instance = "controllers.core1.sensor_west"
generics = "crate::ProximitySensorDevice, crate::DataReadyPinType, crate::SystemCommand"
shell_name = "west"

[[apps.cat_detector.partitions]]
name = "panic"
board_partition = "fs"
kind = "Map"

[[apps.cat_detector.partitions]]
name = "telemetry"
board_partition = "telemetry"
kind = "Queue"

[apps.cat_detector.features]
inactivity_timeout_seconds = 30

[apps.cat_detector.features.motor]
channel = "MOTOR_CHANNEL"
max_speed = "model::types::MotorSpeed::MAX"

[apps.cat_detector.features.battery]
channel = "BATTERY_CHANNEL"
critical_soc = "CRITICAL_BATTERY_SOC_THRESHOLD"
hysteresis = "BATTERY_SOC_HYSTERESIS"
low_soc = "LOW_BATTERY_SOC_THRESHOLD"
mid_soc = "MID_BATTERY_SOC_THRESHOLD"
high_soc = "HIGH_BATTERY_SOC_THRESHOLD"

[apps.cat_detector.features.proximity]
channels = ["SENSOR_NORTH_CHANNEL", "SENSOR_EAST_CHANNEL", "SENSOR_WEST_CHANNEL"]
press_threshold = "DEFAULT_PRESS_THRESHOLD_MM"
near_threshold = "DEFAULT_NEAR_THRESHOLD_MM"
wake_threshold = "DEFAULT_WAKE_THRESHOLD_MM"
gesture_action = "controller::GestureAction::TogglePower"
telemetry = "TELEMETRY_CHANNEL"

[apps.cat_detector.features.led]
channel = "LED_CHANNEL"

[apps.cat_detector.features.thermal]
channel = "THERMAL_CHANNEL"
overheating_threshold = "OVERHEATING_TEMP_THRESHOLD_MC"
critical_threshold = "CRITICAL_TEMP_THRESHOLD_MC"
