project_name: Carrier Board 2.0
device_chip: MCXN947
flash_addr: 0x00010000
flash_size: 1966080
cargo_target: "cargo run --package cat_detector --bin carrier_board_shell"
steps:
  - id: "1"
    name: Verify Primary Power Rails and Ground Reference
    type: hardware_check
    test_points:
      TP1: GND
      TP2: VBAT (3.0V - 4.2V)
      TP3: VBUS (4.75V - 5.25V when USB connected)
      TP4: SYS_3V3 (3.30V +/- 2%)
    description: Measure voltage on test points TP1..TP4 to confirm power integrity before logic release.

  - id: "2"
    name: Verify Load Switch Power Gating
    type: hardware_check
    control_pins:
      PWR_EN_AUDIO: L4
      PWR_EN_SENSORS: L5
      PWR_EN_DEBUG: M4
    description: Verify that load switches Q2, Q3, and Q4 cleanly gate 3.3V power to audio, sensors, and debug domains.

  - id: "3"
    name: Carrier Board Shell Banner & Logo Inspection
    type: shell_command
    command: carrier_board_shell
    expected_regex: "ANTIGRAVITY // CARRIER BOARD 2.0"
    description: Execute carrier_board_shell and verify the hardware ASCII logo banner outputs correctly.

  - id: "4"
    name: Scan Core I2C0 Bus
    type: shell_command
    command: i2c scan 0
    expected_regex: "Found device at 0x14.*Found device at 0x36"
    description: Scan Core I2C0 bus for TI LP5009 (0x14) and ADI MAX17048 (0x36).

  - id: "5"
    name: Scan Touch I2C1 Bus
    type: shell_command
    command: i2c scan 1
    expected_regex: "Found device at 0x44"
    description: Scan Touch I2C1 bus for Azoteq IQS7222A ProxFusion controller (0x44).

  - id: "6"
    name: FlexSPI NAND Flash JEDEC ID
    type: shell_command
    command: flash jedec_id
    expected_regex: "Manufacturer ID: 0xEF, Device ID: 0xAA21"
    description: Read JEDEC ID from Winbond W25N01GV 1Gb serial SLC NAND flash over FlexSPI Port A.

  - id: "7"
    name: Verify Charger Status Signals
    type: shell_command
    command: charger status
    expected_regex: "CHG_STAT: (ASSERTED|IDLE), CHG_PGOOD: ASSERTED"
    description: Verify TI BQ24074 /CHG (G5) and /PGOOD (M10) pin states.

  - id: "8"
    name: Query Battery Fuel Gauge Telemetry
    type: shell_command
    command: battery status
    expected_regex: "Battery: \\d+ mV, State of Charge: \\d+%"
    description: Verify communication with MAX17048 ModelGauge fuel gauge.

  - id: "9"
    name: Test RGB LED Driver Breathing Animation
    type: shell_command
    command: led test_pattern breathe
    expected_regex: "LP5009 pattern active"
    description: Command TI LP5009 to execute logarithmic brightness ramp on RGB status indicator.

  - id: "10"
    name: Calibrate Capacitive Touch & Proximity Electrodes
    type: shell_command
    command: touch calibrate
    expected_regex: "IQS7222A calibration complete: 4 channels tuned"
    description: Perform baseline calibration on Azoteq IQS7222A touch electrodes CR0..CR7.

  - id: "11"
    name: Audio Output & Frequency Synthesis Smoke Test
    type: shell_command
    command: audio test_tone 1000 500
    expected_regex: "Audio tone completed"
    description: Drive 1 kHz tone through MAX98357A PDM Class-D amp and piezo sounder on D15.

  - id: "12"
    name: Wireless BLE Ping Test
    type: shell_command
    command: ble ping
    expected_regex: "NINA-B312 response: OK"
    description: Send test command to u-blox NINA-B312 BLE module over 1 Mbps UART.

  - id: "13"
    name: Dual-Core Inter-Core IPC Handshake
    type: shell_command
    command: ipc ping
    expected_regex: "Core 1 handshake acknowledged: RTT = \\d+ us"
    description: Verify inter-core Messaging Unit (MU) handshake between Core 0 and Core 1.
