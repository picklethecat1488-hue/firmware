[package]
name = "peripherals"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = []
mock = []
tracing = ["platform/tracing", "dep:tracing-defmt", "dep:defmt"]
core1 = []
motor-core = ["core1"]
sensors-core = ["core1"]
verbose-sensor-logging = []

[dependencies]
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
model = { path = "../model" }
embedded-storage = "0.3"
platform = { path = "../platform" }
embassy-time = "0.4.0"
smart-leds-trait = "0.2.1"
fixed = "1.31.0"
tracing-defmt = { version = "0.1.2", optional = true }
defmt = { version = "0.3", optional = true }
embassy-futures = "0.1.0"

[dev-dependencies]
peripherals = { path = ".", features = ["mock"] }

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
defmt = "0.3"
embassy-rp = { version = "0.3.0", features = ["rp2040", "defmt"] }

[target.'cfg(not(all(target_arch = "arm", target_os = "none")))'.dev-dependencies]
embassy-executor = { version = "0.7.0", features = ["arch-std", "executor-thread", "task-arena-size-1048576"] }

